services:
  - type: web
    name: worshipchord-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: worshipchord
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
